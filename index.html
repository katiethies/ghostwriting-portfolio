<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Katie Thies</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  #page {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px 40px 100px;
  }

  /* LINKEDIN CARD */
  #li-card {
    background: #1b1f23;
    border: 1px solid #2d3238;
    border-radius: 12px;
    width: 100%;
    max-width: 540px;
    overflow: hidden;
  }

  #li-card-inner {
    padding: 16px 16px 0;
  }

  #li-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 14px;
  }

  #li-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #4a5568;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 600;
    color: #e2e8f0;
  }

  #li-name-row {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 2px;
  }

  #li-name {
    font-weight: 600;
    font-size: 15px;
    color: #e2e8f0;
  }

  #li-badge {
    background: #0a66c2;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 4px;
    border-radius: 2px;
    line-height: 1.4;
  }

  #li-title {
    font-size: 13px;
    color: #8b9bb4;
    margin-bottom: 2px;
  }

  #li-time {
    font-size: 12px;
    color: #8b9bb4;
  }

  #li-body {
    color: #d8dde6;
    font-size: 15px;
    line-height: 1.65;
    padding-bottom: 16px;
  }

  #li-reactions {
    padding: 8px 16px;
    border-top: 1px solid #2d3238;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #li-reactions span {
    font-size: 13px;
    color: #8b9bb4;
  }

  #li-actions {
    padding: 4px 8px 8px;
    border-top: 1px solid #2d3238;
    display: flex;
    justify-content: space-around;
  }

  .li-action-btn {
    background: none;
    border: none;
    cursor: default;
    display: flex;
    align-items: center;
    gap: 6px;
    color: #8b9bb4;
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 6px;
    font-family: inherit;
  }

  /* NAME TOP LEFT */
  #nameblock {
    position: fixed;
    top: 28px;
    left: 36px;
    z-index: 100;
    line-height: 1.25;
  }
  #nameblock .name {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #fff;
    display: block;
  }
  #nameblock .sub {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 0.72rem;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: #666;
    display: block;
    margin-top: 3px;
  }

  /* HAMBURGER */
  #menu-btn {
    position: fixed;
    top: 26px;
    right: 32px;
    z-index: 100;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 4px;
  }
  #menu-btn span {
    display: block;
    width: 22px;
    height: 1.5px;
    background: #fff;
  }

  /* MENU PANEL */
  #menu-panel {
    display: none;
    position: fixed;
    top: 0;
    right: 0;
    width: 300px;
    height: 100%;
    background: #fff;
    z-index: 999;
  }
  #menu-panel.open { display: block; }

  #menu-close {
    position: absolute;
    top: 24px;
    right: 24px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.8rem;
    font-weight: 300;
    font-family: Arial, Helvetica, sans-serif;
    color: #000;
    line-height: 1;
    padding: 0;
  }

  #menu-bottom {
    position: absolute;
    bottom: 48px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 50px;
  }
  #menu-bottom a.li-link {
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }
  #menu-bottom a.li-link svg {
    width: 28px;
    height: 28px;
    display: block;
  }
  #menu-bottom a.menu-email {
    font-family: 'Work Sans', Arial, sans-serif;
    font-size: 1.07rem;
    color: #000;
    text-decoration: none;
    text-align: center;
  }
  #menu-bottom a.menu-email:hover { text-decoration: underline; }

  /* SLIDER */
  #slider-wrap {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 26px 40px 30px;
    display: flex;
    align-items: center;
    gap: 20px;
    background: #000;
    border-top: 1px solid #1a1a1a;
  }
  .slider-label {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.03em;
    color: #555;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #sell-slider {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 1px;
    background: #2a2a2a;
    outline: none;
    cursor: pointer;
  }
  #sell-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
  }
  #sell-slider::-moz-range-thumb {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    border: none;
  }
  #sell-slider::-moz-range-track {
    height: 1px;
    background: #2a2a2a;
  }
</style>
</head>
<body>

<div id="nameblock">
  <span class="name">Katie Thies</span>
  <span class="sub">LinkedIn Ghostwriter</span>
</div>

<button id="menu-btn" aria-label="Open menu">
  <span></span><span></span><span></span>
</button>

<div id="menu-panel">
  <button id="menu-close" aria-label="Close menu">&#x2715;</button>
  <div id="menu-bottom">
    <a href="https://www.linkedin.com/in/catherinethies/" target="_blank" rel="noopener" class="li-link" aria-label="LinkedIn">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" fill="#000"/>
      </svg>
    </a>
    <a href="mailto:katie@katiethies.co" class="menu-email">katie@katiethies.co</a>
  </div>
</div>

<div id="page">
  <div id="li-card">
    <div id="li-card-inner">
      <div id="li-header">
        <div id="li-avatar">KT</div>
        <div>
          <div id="li-name-row">
            <span id="li-name">Katie Thies</span>
            <span id="li-badge">in</span>
          </div>
          <div id="li-title">LinkedIn Ghostwriter</div>
          <div id="li-time">11h · 🌐</div>
        </div>
      </div>
      <div id="li-body"></div>
    </div>
    <div id="li-reactions">
      <span>👍💡👏 <span id="li-reactions-count">190 reactions</span></span>
      <span><span id="li-comments-count">60 comments</span> · <span id="li-reposts-count">7 reposts</span></span>
    </div>
    <div id="li-actions">
      <button class="li-action-btn">👍 Like</button>
      <button class="li-action-btn">💬 Comment</button>
      <button class="li-action-btn">🔁 Repost</button>
      <button class="li-action-btn">✉️ Send</button>
    </div>
  </div>
</div>

<div id="slider-wrap">
  <span class="slider-label">Less Hard Sell</span>
  <input type="range" id="sell-slider" min="0" max="53" step="1" value="17">
  <span class="slider-label">More Hard Sell</span>
</div>

<script>
const SHEET_URL = 'https://corsproxy.io/?' + encodeURIComponent('https://docs.google.com/spreadsheets/d/e/2PACX-1vRcGXwIhzI0LKpYwzkwDrg7yx8SBt2MvzzMaIOoLLuIMguQskLooMEN1Yhs4Dk9b-9rxI2ic8Mh5AcQ/pub?gid=0&single=true&output=csv');

const slider = document.getElementById('sell-slider');
const bodyEl = document.getElementById('li-body');
const reactionsEl = document.getElementById('li-reactions-count');
const commentsEl = document.getElementById('li-comments-count');
const repostsEl = document.getElementById('li-reposts-count');

let rows = [];
let lastVal = 0;

function parseCSV(csv) {
  return csv.split('\n').map(line => {
    const cols = [];
    let cur = '', inQuote = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQuote = !inQuote; }
      else if (ch === ',' && !inQuote) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    return cols;
  }).filter(r => r[0] && r[0].length > 0);
}

function updateCard(val) {
  if (rows.length === 0) return;
  const idx = Math.round(val / parseInt(slider.max) * (rows.length - 1));
  const row = rows[idx];
  if (!row) return;
  bodyEl.textContent = row[0] || '';
  reactionsEl.textContent = row[1] || '';
  commentsEl.textContent = row[2] || '';
  repostsEl.textContent = row[3] || '';
}

fetch(SHEET_URL)
  .then(r => r.text())
  .then(csv => {
    rows = parseCSV(csv);
    slider.max = rows.length - 1;
    const initVal = Math.round((rows.length - 1) / 3);
    slider.value = initVal;
    lastVal = initVal;
    updateCard(initVal);
  })
  .catch((e) => {
    bodyEl.textContent = "Couldn't load copy from sheet. Check the console for details.";
    console.error('Sheet fetch failed:', e);
  });

slider.addEventListener('input', () => {
  const val = parseInt(slider.value);
  if (val !== lastVal) {
    updateCard(val);
    lastVal = val;
  }
});

document.getElementById('menu-btn').onclick = function() {
  document.getElementById('menu-panel').classList.add('open');
};
document.getElementById('menu-close').onclick = function() {
  document.getElementById('menu-panel').classList.remove('open');
};
</script>

</body>
</html>
